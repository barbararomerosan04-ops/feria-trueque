<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feria Trueque Falabella</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  background: #62683f;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  font-family: Arial, Helvetica, sans-serif;
}

.pantalla {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.contenedor {
  position: relative;
  width: min(100vw, 580px);
  overflow: hidden;
}

.imagen {
  width: 100%;
  height: auto;
  display: block;
}

/* NÚMEROS */
.numero {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  text-align: center;
  font-size: clamp(30px, 6vw, 38px);
  font-weight: 500;
  line-height: 1;
  z-index: 5;
}

/* Posiciones de los números sobre el diseño */
#agua {
  top: 31.1%;
  color: #73b9f2;
}

#co2 {
  top: 69.8%;
  color: #d5ff32;
}
</style>
</head>

<body>

<div class="pantalla">

  <div class="contenedor">

    <!-- DISEÑO ORIGINAL -->
    <img
      class="imagen"
      src="Dashboard-Trueque%203.jpg"
      alt="Feria Trueque Falabella"
    >

    <!-- DATOS -->
    <div id="agua" class="numero">182,20</div>
    <div id="co2" class="numero">296,08</div>

  </div>

</div>

<script>
async function actualizarDatos() {
  try {

    const respuesta = await fetch('data.json?v=' + Date.now());
    const data = await respuesta.json();

    const agua = Number(data.agua);
    const co2 = Number(data.co2);

    document.getElementById('agua').textContent =
      agua.toFixed(2).replace('.', ',');

    document.getElementById('co2').textContent =
      co2.toFixed(2).replace('.', ',');

  } catch (error) {
    console.error('No se pudieron cargar los datos:', error);
  }
}

actualizarDatos();
</script>

</body>
</html>
