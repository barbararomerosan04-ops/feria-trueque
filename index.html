<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Feria Trueque</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #62693f;
    }

    .pantalla {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #62693f;
    }

    .pieza {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    /*
      NÚMERO DE AGUA
    */

    #agua {
      position: absolute;
      left: 0;
      width: 100%;
      top: 35.55%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;

      font-size: clamp(
        24px,
        3.8vw,
        52px
      );

      color: #7fcfff;

      z-index: 10;
    }

    /*
      NÚMERO DE CO2
    */

    #co2 {
      position: absolute;
      left: 0;
      width: 100%;
      top: 71.05%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;

      font-size: clamp(
        24px,
        3.8vw,
        52px
      );

      color: #d7ff32;

      z-index: 10;
    }

  </style>

</head>

<body>

  <div class="pantalla">

    <img
      class="pieza"
      src="Dashboard-Trueque%203.jpg"
      alt="Feria Trueque Falabella"
    >

    <div id="agua">
      0
    </div>

    <div id="co2">
      0
    </div>

  </div>

  <script>

    async function actualizar() {

      try {

        const respuesta = await fetch(
          "data.json?v=" + Date.now()
        );

        if (!respuesta.ok) {
          throw new Error(
            "No se pudo cargar data.json"
          );
        }

        const datos =
          await respuesta.json();

        if (
          datos.agua !== undefined &&
          datos.agua !== null
        ) {

          document.getElementById(
            "agua"
          ).textContent = Number(datos.agua).toLocaleString(
            "es-PE",
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          );

        }

        if (
          datos.co2 !== undefined &&
          datos.co2 !== null
        ) {

          document.getElementById(
            "co2"
          ).textContent = Number(datos.co2).toLocaleString(
            "es-PE",
            {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            }
          );

        }

      }

      catch (error) {

        console.log(
          "Error cargando datos:",
          error
        );

      }

    }

    actualizar();

    setInterval(
      actualizar,
      10000
    );

  </script>

</body>

</html>
