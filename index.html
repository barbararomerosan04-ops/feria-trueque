<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Trueque Falabella</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: #62693f;
}

.pantalla {
  width: 100vw;
  min-height: 100vh;
  background: #62693f;

  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.marco {
  position: relative;
  width: min(50vw, 540px);
  container-type: inline-size;
}

.pieza {
  display: block;
  width: 100%;
  height: auto;
}

/* =========================
   NÚMERO DE AGUA
   ========================= */

#agua {
  position: absolute;

  left: 29%;
  top: 34.5%;

  width: 42%;
  height: 7.8%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Arial, Helvetica, sans-serif;
  font-weight: bold;

  font-size: 11cqw;
  line-height: 1;

  color: #7fcfff;

  z-index: 20;

  background: transparent;
}


/* =========================
   NÚMERO DE CO2
   ========================= */

#co2 {
  position: absolute;

  left: 29%;
  top: 73.2%;

  width: 42%;
  height: 7.8%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Arial, Helvetica, sans-serif;
  font-weight: bold;

  font-size: 11cqw;
  line-height: 1;

  color: #d7ff32;

  z-index: 20;

  background: transparent;
}

</style>

</head>


<body>

<div class="pantalla">

  <div class="marco">

    <img
      class="pieza"
      src="https://raw.githubusercontent.com/barbararomerosan04-ops/feria-trueque/main/Dashboard-Trueque%203.jpg"
      alt="Feria Trueque Falabella"
    >

    <div id="agua">182.2</div>

    <div id="co2">296.08</div>

  </div>

</div>


<script>

async function actualizar() {

  try {

    const respuesta = await fetch(
      "data.json?v=" + Date.now()
    );

    if (!respuesta.ok) {
      throw new Error("No se pudo cargar data.json");
    }

    const datos = await respuesta.json();

    if (datos.agua !== undefined) {
      document.getElementById("agua").textContent = datos.agua;
    }

    if (datos.co2 !== undefined) {
      document.getElementById("co2").textContent = datos.co2;
    }

  } catch (error) {
    console.log("Error:", error);
  }
}

actualizar();

setInterval(actualizar, 10000);

</script>

</body>
</html>
