<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feria Trueque</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #62693f;
    }

    /*
      PANTALLA COMPLETA
    */

    .pantalla {
      width: 100vw;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
      background: #62693f;
    }


    /*
      CONTENEDOR DE LA PIEZA

      IMPORTANTE:
      Todo lo que se mueve encima de la imagen
      está dentro de este contenedor.

      Así los números mantienen exactamente
      la posición de tu diseño.
    */

    .pieza-container {
      position: relative;

      height: 100vh;
      width: auto;

      aspect-ratio: auto;

      flex-shrink: 0;
    }


    /*
      IMAGEN ORIGINAL
    */

    .pieza {
      display: block;

      height: 100vh;
      width: auto;

      max-width: none;
    }


    /*
      NÚMERO DE AGUA
    */

    #agua {

      position: absolute;

      /*
        Posición dentro de la pieza
      */

      left: 31.5%;
      top: 34.8%;

      width: 37%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      font-weight: 700;

      font-size: 5.2vh;

      line-height: 1;

      color: #7fcfff;

      z-index: 10;

      white-space: nowrap;
    }


    /*
      NÚMERO DE CO2
    */

    #co2 {

      position: absolute;

      left: 31.5%;
      top: 70.2%;

      width: 37%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      font-weight: 700;

      font-size: 5.2vh;

      line-height: 1;

      color: #d7ff32;

      z-index: 10;

      white-space: nowrap;
    }


  </style>

</head>


<body>

  <div class="pantalla">

    <div class="pieza-container">

      <!-- IMAGEN ORIGINAL -->

      <img
        class="pieza"
        src="Dashboard-Trueque%203.jpg"
        alt="Feria Trueque Falabella"
      >


      <!-- NÚMEROS DINÁMICOS -->

      <div id="agua">182.2</div>

      <div id="co2">296.08</div>

    </div>

  </div>


  <script>

    /*
      CARGAR DATOS DESDE data.json

      La página NO se conecta a Google.

      Lee únicamente el archivo data.json
      que está alojado en GitHub.
    */

    async function actualizar() {

      try {

        const respuesta = await fetch(
          "data.json?v=" + Date.now()
        );

        if (!respuesta.ok) {
          throw new Error("No se pudo cargar data.json");
        }

        const datos = await respuesta.json();


        /*
          AGUA
        */

        if (
          datos.agua !== undefined &&
          datos.agua !== null
        ) {

          document.getElementById("agua").textContent =
            datos.agua;

        }


        /*
          CO2
        */

        if (
          datos.co2 !== undefined &&
          datos.co2 !== null
        ) {

          document.getElementById("co2").textContent =
            datos.co2;

        }

      }

      catch (error) {

        console.log(
          "Error cargando datos:",
          error
        );

      }

    }


    /*
      CARGA INICIAL
    */

    actualizar();


    /*
      ACTUALIZA CADA 10 SEGUNDOS
    */

    setInterval(
      actualizar,
      10000
    );

  </script>

</body>

</html>
