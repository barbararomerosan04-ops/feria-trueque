<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Trueque Falabella</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #62693f;
}

/* PANTALLA */
.pantalla {
  width: 100vw;
  height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #62693f;
}

/* CONTENEDOR DE LA PIEZA */
.pieza {
  position: relative;

  height: 87.55vh;
  width: auto;

  aspect-ratio: 1 / 3;

  flex-shrink: 0;
}

/* IMAGEN */
.pieza img {
  width: 100%;
  height: 100%;

  display: block;

  object-fit: fill;
}

/* =========================
   AGUA
   ========================= */

#agua {
  position: absolute;

  left: 50%;
  top: 34.45%;

  transform: translate(-50%, -50%);

  width: 55%;

  text-align: center;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 36px;
  font-weight: 700;

  color: #7fcfff;

  line-height: 1;

  z-index: 10;
}


/* =========================
   CO2
   ========================= */

#co2 {
  position: absolute;

  left: 50%;
  top: 73.55%;

  transform: translate(-50%, -50%);

  width: 55%;

  text-align: center;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 36px;
  font-weight: 700;

  color: #d7ff32;

  line-height: 1;

  z-index: 10;
}

</style>
</head>

<body>

<div class="pantalla">

  <div class="pieza">

    <img
      src="Dashboard-Trueque%203.jpg"
      alt="Feria Trueque Falabella"
    >

    <div id="agua">182.2</div>

    <div id="co2">296.08</div>

  </div>

</div>


<script>

async function actualizar() {

  try {

    const respuesta = await fetch(
      "data.json?v=" + Date.now()
    );

    const datos = await respuesta.json();

    if (datos.agua !== undefined) {
      document.getElementById("agua").textContent = datos.agua;
    }

    if (datos.co2 !== undefined) {
      document.getElementById("co2").textContent = datos.co2;
    }

  } catch (error) {

    console.log("Error cargando datos:", error);

  }

}

actualizar();

setInterval(actualizar, 10000);

</script>

</body>
</html>
