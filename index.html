<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Trueque Falabella</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #62683f;
}

body {
    font-family: Arial, Helvetica, sans-serif;
}

/* =================================
   PANTALLA COMPLETA
   ================================= */

.pantalla {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    overflow: hidden;
}

/* =================================
   CONTENEDOR
   ================================= */

.contenedor {
    position: relative;

    width: 100vw;
    height: 100vh;

    margin: 0;
    padding: 0;

    overflow: hidden;
}

/* =================================
   IMAGEN
   ================================= */

.imagen {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;

    object-fit: fill;
}

/* =================================
   NÚMEROS
   ================================= */

.numero {
    position: absolute;

    left: 50%;

    width: 100%;

    transform: translate(-50%, -50%);

    text-align: center;

    font-family: Arial, Helvetica, sans-serif;
    font-weight: 400;

    line-height: 1;

    white-space: nowrap;

    z-index: 10;

    pointer-events: none;
}

/* =================================
   AGUA
   ================================= */

#agua {
    top: 34.0%;

    color: #73b9f2;

    font-size: 50px;
}

/* =================================
   CO2
   ================================= */

#co2 {
    top: 74.0%;

    color: #d5ff32;

    font-size: 50px;
}


/* =================================
   PANTALLAS VERTICALES 1:3
   ================================= */

@media (min-aspect-ratio: 1/3) {

    .imagen {
        width: 100vw;
        height: 100vh;
    }

}

</style>
</head>

<body>

<div class="pantalla">

    <div class="contenedor">

        <img
            class="imagen"
            src="Dashboard-Trueque%203.jpg"
            alt="Feria Trueque Falabella"
        >

        <div id="agua" class="numero">
            182,20
        </div>

        <div id="co2" class="numero">
            296,08
        </div>

    </div>

</div>


<script>

async function actualizarDatos() {

    try {

        const respuesta = await fetch(
            'data.json?v=' + Date.now()
        );

        const data = await respuesta.json();

        document.getElementById('agua').textContent =
            Number(data.agua)
            .toFixed(2)
            .replace('.', ',');

        document.getElementById('co2').textContent =
            Number(data.co2)
            .toFixed(2)
            .replace('.', ',');

    } catch (error) {

        console.error(
            'No se pudieron cargar los datos:',
            error
        );

    }

}

actualizarDatos();

</script>

</body>
</html>
