<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feria Trueque Falabella</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  background: #62683f;
  font-family: Arial, Helvetica, sans-serif;
}

.pantalla {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.contenedor {
  position: relative;
  width: min(100vw, 760px);
  margin: 0 auto;
  overflow: hidden;
}

.imagen {
  width: 100%;
  height: auto;
  display: block;
}

.numero {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;
  text-align: center;
  font-size: 38px;
  font-weight: 500;
  line-height: 1;
  z-index: 5;
}

#agua {
  top: 36.7%;
  color: #73b9f2;
}

#co2 {
  top: 75.7%;
  color: #d5ff32;
}
</style>
</head>

<body>

<div class="pantalla">
  <div class="contenedor">

    <img
      class="imagen"
      src="Dashboard-Trueque%203.jpg"
      alt="Feria Trueque Falabella"
    >

    <div id="agua" class="numero">182,20</div>
    <div id="co2" class="numero">296,08</div>

  </div>
</div>

<script>
async function actualizarDatos() {
  try {
    const respuesta = await fetch('data.json?v=' + Date.now());
    const data = await respuesta.json();

    document.getElementById('agua').textContent =
      Number(data.agua).toFixed(2).replace('.', ',');

    document.getElementById('co2').textContent =
      Number(data.co2).toFixed(2).replace('.', ',');

  } catch (error) {
    console.error('No se pudieron cargar los datos:', error);
  }
}

actualizarDatos();
</script>

</body>
</html>
