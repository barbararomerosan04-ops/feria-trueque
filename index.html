<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Trueque Falabella</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #62693f;
}

.pantalla {
  width: 100vw;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #62693f;
}

.pieza {
  position: relative;
  width: min(33.3333vw, 426.67px);
  height: auto;
  display: block;
}

/* CONTENEDOR SOBRE LA IMAGEN */

.contenido {
  position: absolute;
  width: min(33.3333vw, 426.67px);
  aspect-ratio: 1 / 3;
}

/* TAPAMOS SOLO EL NÚMERO ANTIGUO */

.mascara-agua {
  position: absolute;
  left: 29%;
  top: 31%;
  width: 42%;
  height: 7.5%;
  background: #62693f;
  border-radius: 18px;
}

.mascara-co2 {
  position: absolute;
  left: 29%;
  top: 69.8%;
  width: 42%;
  height: 7.5%;
  background: #62693f;
  border-radius: 18px;
}

/* NÚMERO AGUA */

#agua {
  position: absolute;
  left: 29%;
  top: 31%;
  width: 42%;
  height: 7.5%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: clamp(25px, 4.8vw, 42px);
  color: #7fcfff;

  z-index: 10;
}

/* NÚMERO CO2 */

#co2 {
  position: absolute;
  left: 29%;
  top: 69.8%;
  width: 42%;
  height: 7.5%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: clamp(25px, 4.8vw, 42px);
  color: #d7ff32;

  z-index: 10;
}

</style>
</head>

<body>

<div class="pantalla">

  <div style="position:relative;">

    <img
      class="pieza"
      src="https://raw.githubusercontent.com/barbararomerosan04-ops/feria-trueque/main/Dashboard-Trueque%203.jpg"
      alt="Feria Trueque Falabella"
    >

    <div class="contenido">

      <div class="mascara-agua"></div>
      <div class="mascara-co2"></div>

      <div id="agua">182.2</div>
      <div id="co2">296.08</div>

    </div>

  </div>

</div>

<script>

async function actualizar() {

  try {

    const respuesta = await fetch(
      "data.json?v=" + Date.now()
    );

    if (!respuesta.ok) {
      throw new Error("No se pudo cargar data.json");
    }

    const datos = await respuesta.json();

    if (datos.agua !== undefined) {
      document.getElementById("agua").textContent = datos.agua;
    }

    if (datos.co2 !== undefined) {
      document.getElementById("co2").textContent = datos.co2;
    }

  } catch (error) {
    console.log(error);
  }
}

actualizar();

setInterval(actualizar, 10000);

</script>

</body>
</html>
