<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Feria Trueque</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #62693f;

    }


    /*
      CONTENEDOR PRINCIPAL

      Mantiene exactamente la proporción
      vertical de la pieza.
    */

    .pantalla {

      position: relative;

      width: 100vw;
      height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

      background: #62693f;

    }


    /*
      LA PIEZA ORIGINAL

      Se adapta a la pantalla sin deformarse.
    */

    .pieza {

      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      object-position: center;

    }


    /*
      CAPA PARA TAPAR EL NÚMERO
      ORIGINAL DEL AGUA
    */

    .tapa-agua {

      position: absolute;

      width: 19.5%;
      height: 4.3%;

      left: 40.25%;
      top: 35.1%;

      background: #6b7047;

      border: 2px solid #8ed7ff;

      border-radius: 25px;

    }


    /*
      CAPA PARA TAPAR EL NÚMERO
      ORIGINAL DEL CO2
    */

    .tapa-co2 {

      position: absolute;

      width: 19.5%;
      height: 4.3%;

      left: 40.25%;
      top: 70.6%;

      background: #6b7047;

      border: 2px solid #d7ff4c;

      border-radius: 25px;

    }


    /*
      NÚMERO DE AGUA
    */

    #agua {

      position: absolute;

      left: 0;

      width: 100%;

      top: 35.55%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      font-weight: bold;

      font-size: clamp(
        25px,
        5vw,
        70px
      );

      color: #7fcfff;

      z-index: 10;

    }


    /*
      NÚMERO DE CO2
    */

    #co2 {

      position: absolute;

      left: 0;

      width: 100%;

      top: 71.05%;

      text-align: center;

      font-family: Arial, Helvetica, sans-serif;

      font-weight: bold;

      font-size: clamp(
        25px,
        5vw,
        70px
      );

      color: #d7ff32;

      z-index: 10;

    }


  </style>

</head>


<body>


  <div class="pantalla">


    <!-- DISEÑO ORIGINAL -->

    <img
      class="pieza"
      src="Dashboard-Trueque%203.jpg"
      alt=""
    >


    <!-- TAPAMOS LOS NÚMEROS IMPRESOS -->

    <div class="tapa-agua"></div>

    <div class="tapa-co2"></div>


    <!-- NÚMEROS DINÁMICOS -->

    <div id="agua">
      182.2
    </div>


    <div id="co2">
      296.08
    </div>


  </div>


  <script>


    /*
      CARGAR DATOS

      La página NO entra a Google.

      Solamente lee:

      data.json

      que está dentro de GitHub.
    */


    async function actualizar() {


      try {


        const respuesta = await fetch(
          "data.json?v=" + Date.now()
        );


        if (!respuesta.ok) {

          throw new Error(
            "No se pudo cargar data.json"
          );

        }


        const datos =
          await respuesta.json();


        /*
          AGUA
        */

        if (
          datos.agua !== undefined &&
          datos.agua !== null
        ) {

          document.getElementById(
            "agua"
          ).textContent = datos.agua;

        }


        /*
          CO2
        */

        if (
          datos.co2 !== undefined &&
          datos.co2 !== null
        ) {

          document.getElementById(
            "co2"
          ).textContent = datos.co2;

        }


      }

      catch (error) {

        console.log(
          "Error cargando datos:",
          error
        );

      }


    }


    /*
      CARGA INICIAL
    */

    actualizar();


    /*
      REVISA CADA 10 SEGUNDOS
    */

    setInterval(
      actualizar,
      10000
    );


  </script>


</body>

</html>
