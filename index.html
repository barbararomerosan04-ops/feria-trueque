<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Trueque Falabella</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background: #62683f;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

.pantalla {
    width: 100vw;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin: 0;
    padding: 0;
}

.contenedor {
    position: relative;
    width: 100vw;
    max-width: none;
    margin: 0;
    padding: 0;
}

.imagen {
    width: 100%;
    height: auto;
    display: block;
}

/* =========================
   NÚMEROS
   ========================= */

.numero {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 100%;

    text-align: center;

    font-weight: 400;
    line-height: 1;

    z-index: 10;

    white-space: nowrap;
}

/* =========================
   AGUA
   ========================= */

#agua {
    top: 33.75%;
    color: #73b9f2;
    font-size: 7.2vw;
}

/* =========================
   CO2
   ========================= */

#co2 {
    top: 73.75%;
    color: #d5ff32;
    font-size: 7.2vw;
}

</style>
</head>

<body>

<div class="pantalla">

    <div class="contenedor">

        <img
            class="imagen"
            src="Dashboard-Trueque%203.jpg"
            alt="Feria Trueque Falabella"
        >

        <div id="agua" class="numero">
            182,20
        </div>

        <div id="co2" class="numero">
            296,08
        </div>

    </div>

</div>

<script>

async function actualizarDatos() {

    try {

        const respuesta = await fetch(
            'data.json?v=' + Date.now()
        );

        const data = await respuesta.json();

        document.getElementById('agua').textContent =
            Number(data.agua)
            .toFixed(2)
            .replace('.', ',');

        document.getElementById('co2').textContent =
            Number(data.co2)
            .toFixed(2)
            .replace('.', ',');

    } catch (error) {

        console.error(
            'No se pudieron cargar los datos:',
            error
        );

    }

}

actualizarDatos();

</script>

</body>
</html>
