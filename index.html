<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Trueque</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #62693f;
}

.pantalla {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* LA PIEZA COMPLETA */
.pieza-contenedor {
    position: relative;

    height: 100vh;
    width: auto;
    aspect-ratio: 0.3333;

    flex-shrink: 0;
}

.pieza {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}

/* =========================
   AGUA
   ========================= */

#agua {
    position: absolute;

    /*
      POSICIÓN DENTRO DE LA PIEZA
    */
    top: 34.0%;
    left: 0;

    width: 100%;

    text-align: center;

    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;

    font-size: 6.2%;

    color: #7fcfff;

    z-index: 5;

    line-height: 1;
}


/* =========================
   CO2
   ========================= */

#co2 {
    position: absolute;

    top: 70.0%;
    left: 0;

    width: 100%;

    text-align: center;

    font-family: Arial, Helvetica, sans-serif;
    font-weight: bold;

    font-size: 5.8%;

    color: #d7ff32;

    z-index: 5;

    line-height: 1;
}

</style>
</head>

<body>

<div class="pantalla">

    <div class="pieza-contenedor">

        <!-- IMAGEN ORIGINAL -->
        <img
            class="pieza"
            src="Dashboard-Trueque%203.jpg"
            alt="Feria Trueque Falabella"
        >

        <!-- DATOS DINÁMICOS -->
        <div id="agua">182.2</div>

        <div id="co2">296.08</div>

    </div>

</div>


<script>

async function actualizarDatos() {

    try {

        const respuesta = await fetch(
            "data.json?v=" + Date.now()
        );

        if (!respuesta.ok) {
            throw new Error("No se pudo cargar data.json");
        }

        const datos = await respuesta.json();

        if (datos.agua !== undefined) {
            document.getElementById("agua").textContent = datos.agua;
        }

        if (datos.co2 !== undefined) {
            document.getElementById("co2").textContent = datos.co2;
        }

    } catch (error) {

        console.log("Error:", error);

    }

}

/* Cargar inmediatamente */
actualizarDatos();

/* Actualizar cada 10 segundos */
setInterval(actualizarDatos, 10000);

</script>

</body>
</html>
