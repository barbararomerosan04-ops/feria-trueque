name: Actualizar datos

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos del Sheet
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/10j4gAOHCmz3owbp4nOpT0oXJgRu_w9gfIsluZFydwXI/export?format=csv&gid=2009250201" -o datos.csv

      - name: Crear data.json
        run: |
          python - <<'PY'
          import csv
          import json

          with open("datos.csv", encoding="utf-8-sig", newline="") as f:
              filas = list(csv.reader(f))

          # F = CO2 / G = Agua
          co2 = filas[1][5].strip().replace(",", ".")
          agua = filas[1][6].strip().replace(",", ".")

          print("Valor CO2 encontrado:", co2)
          print("Valor Agua encontrado:", agua)

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump({
                  "agua": float(agua),
                  "co2": float(co2)
              }, f)

          print("data.json actualizado correctamente")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git commit -m "Actualizar datos" || exit 0
          git push
