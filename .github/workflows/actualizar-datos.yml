name: Actualizar datos

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Descargar datos del Sheet
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1573VG0OhCjv03FrCrLKGTa1HkKU33GJto9isjJXvf5s/export?format=csv&gid=2009250201" -o datos.csv

      - name: Crear data.json
        run: |
          python - <<'PY'
          import csv
          import json

          with open("datos.csv", encoding="utf-8-sig") as f:
              filas = list(csv.reader(f))

          print("Datos encontrados:")
          for fila in filas[:5]:
              print(fila)

          # Buscar la fila que contiene los valores numéricos
          for fila in filas:
              numeros = []

              for valor in fila:
                  try:
                      numeros.append(float(valor.replace(",", ".")))
                  except:
                      pass

              if len(numeros) >= 2:
                  agua = numeros[0]
                  co2 = numeros[1]
                  break

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump({
                  "agua": agua,
                  "co2": co2
              }, f, ensure_ascii=False, indent=2)

          print("Agua:", agua)
          print("CO2:", co2)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git commit -m "Actualizar datos" || exit 0
          git push
